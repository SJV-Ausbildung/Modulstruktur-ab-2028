:root{

}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 18px/1.5 var(--f-body);

.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.2px}
h1{font-size:clamp(40px,7vw,68px);font-weight:700}

p{margin:0}
.muted{color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;padding-block:16px 0}
.logos{display:flex;gap:16px;align-items:center;background:#fff;border-radius:12px;padding:8px 14px}

.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}

.tabs{display:flex;flex-wrap:wrap;gap:8px}

.lead{font-size:20px;color:var(--muted);max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}

table{border-collapse:collapse;width:100%;min-width:640px;font-size:16px}

.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}

.btn[disabled]{opacity:.4;cursor:default}
.dots{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.ov{position:fixed;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:var(--surface);color:var(--ink);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.dlg dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:16px}
.dlg dt{color:var(--muted)} .dlg dd{margin:0}
.chip{display:inline-block;font:600 13px var(--f-body);background:var(--soft);border-radius:999px;padding:3px 10px;margin-right:6px}
footer{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.ebtn{font:inherit;font-size:14px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 12px;cursor:pointer}
.ebar{position:sticky;bottom:0;background:var(--navy);color:var(--navy-ink);border-radius:12px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:8px}
.ebar input{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);min-width:220px;flex:1 1 220px;background:var(--surface);color:var(--ink)}
body.editing [data-e]{outline:1px dashed var(--accent);outline-offset:2px;border-radius:3px;cursor:text;min-width:1ch;display:inline-block}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.wegs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.wcard.dark{background:var(--navy);color:var(--navy-ink);border-color:transparent}
.wcard.open{border-color:var(--accent)}
.wh{font:inherit;color:inherit;background:none;border:0;text-align:left;width:100%;cursor:pointer;padding:22px;display:flex;flex-direction:column;gap:8px}
.wh .big{font:700 40px/1.05 var(--f-display)}
.wh .wd{font-size:17px}
.wh .wt{font:600 15px var(--f-body);color:var(--accent);margin-top:4px}
.wcard.dark .wh .wt,.wcard.dark .eyebrow{color:inherit;opacity:.85}
.wb{padding:0 22px 22px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)}
.wcard.dark .wb{border-top-color:rgba(255,255,255,.25)}
.wst{font:600 14px var(--f-body);text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-top:10px}
.wcard.dark .wst{color:inherit;opacity:.8}
.wcard.dark .list li{border-top-color:rgba(255,255,255,.2)}
.wk{font-size:15px;opacity:.9;margin-top:8px}
.btn.sm{font-size:15px;padding:6px 14px;margin-left:8px}
body.editing .wh{cursor:default}
.longh{margin:16px 0 4px}
.longl{margin-bottom:12px}
.longl li{padding:6px 0}

:"Inhalt, Dauer, Zielgruppe","r1d":"Jedes alte Modul wird mit dem neuen Modul in drei Punkten verglichen: Passt der Inhalt? Dauert es gleich lang? Ist die Zielgruppe dieselbe?","r2t":"Ab 80 % Übereinstimmung","r2n":"Voller Ersatz","r2d":"Das alte Modul ersetzt das neue ganz.","r3t":"Ab 40 % Übereinstimmung","r3n":"Teilweiser Ersatz","r3d":"Das alte Modul zählt zum Teil, es braucht eine Ergänzung. Darunter gibt es keine Anrechnung.","r4":"Kürzere Module und andere Zielgruppen senken den Wert: Dauert das alte Modul weniger Tage als das neue, sinkt der Wert im gleichen Verhältnis. Gleiche Zielgruppe zählt voll, verwandte zur Hälfte, andere gar nicht. Die Prozentwerte für den Inhalt sind Startwerte und werden mit den Kursunterlagen abgeglichen.","p2c":"Neun alte Module werden durch neue Module voll ersetzt","cAlt":"Altes Modul","cErsetzt":"Ersetzt voll das neue Modul","n2c":"Neun alte Module werden durch ein oder zwei neue Module voll ersetzt.","p2d":"Alte Module ohne volle Entsprechung","cWas":"Was gilt","n2d":"Vier alte Module sind nicht voll ersetzt: eine teilweise Entsprechung, drei ohne Entsprechung.","p2e":"Von neu zu alt: Foundation","p2f":"Von neu zu alt: Talent","cNeu":"Neues Modul","cDurch":"Ersetzt (altes Modul)","newfull":"neues Modul","voll":"voll","teilw":"teilweise","n2e":"Pro neues Modul: welches alte Modul führt dorthin. Drei Foundation-Module sind ganz neu.","n2f":"Talent Leistungssport setzt alle fünf anderen Talent-Module voraus. Psyche/Kooperation Talent ist neu.","p2g":"Grundsätze der Anrechnung","g1t":"Grundsatz 1","g1n":"Angebot ist nicht Anerkennung","g1d":"Dass ein neues Modul ein altes im Angebot ablöst, heisst noch nicht, dass besuchte Module angerechnet werden.","g2t":"Grundsatz 2","g2n":"Nur bestandene Module","g2d":"Ein Besuch als Gast zählt nicht. Massgebend ist die J+S-Biografie in der NDS.","g3t":"Grundsatz 3","g3n":"Weiterbildung 1 und 2","g3d":"Weiterbildung 1 zählt als Foundation, Weiterbildung 2 als Talent. Wer alle Module einer Stu mit Kindern und Jugendlichen mit Behinderung. Die Zusätze Athletik und Psyche berechtigen zu Trainings mit diesem Fokus in allen Sportarten.","p4":"Fragerunde","q_lead":"Eure Fragen zur neuen Modulstruktur.","q_txt":"Bitte notiere deine Fragen vorab im Padlet. Wir gehen am MFE in der Fragerunde darauf ein.","padlet":"Fragen im Padlet notieren","foot":"Stand 28. Oktober 2026. Das Konzept wird vorgestellt; Änderungen im Detail bleiben vorbehalten.","dStufe":"Stufe","dWege":"Pflicht in den Wegen","dErsetzt":"Hervorgegangen aus","dNone":"keine","dOffen":"Die Voraussetzung wird noch geklärt.","dWE":"Am selben Wochenende mit","dZus":"Erteilt","eEdit":"Texte bearbeiten","eSave":"Speichern","eCancel":"Abbrechen","ePad":"Padlet-Link","eHint":"Klicke in einen Text und ändere ihn. Die Texte gelten pro Sprache: schalte oben zwischen DE und FR um.","dLang":"Kurse und Sprache","lang_sep":"Pro Jahr gibt es einen Kurs auf Deutsch (Deutschschweiz) und einen eigenen Kurs auf Französisch (Romandie). Das sind zwei getrennte Kurse, kein zweisprachiger Kurs.","lang_cyc":"Ein Kurs alle zwei Jahre, für die Deutschschweiz und die Romandie gemeinsam.","lang_alt":"Jedes Jahr ein Kurs, abwechselnd auf Deutsch und auf Französisch: Jede Sprache kommt alle zwei Jahre an die Reihe.","lang_bil":"Ein zweisprachiger Kurs (Deutsch und Französisch) für alle Regionen. Es gibt nicht je einen Kurs pro Sprache. Das Modul findet alle zwei Jahre statt, erstmals 2029.","ld_mix":"Judo und Ju-Jitsu besuchen denselben Kurs.","ld_mix11":"Judo und Ju-Jitsu besuchen denselben Kurs.","ld_sepd":"Judo und Ju-Jitsu haben je eigene Kurse.","ld_two":"Judo: Pro Jahr ein Kurs auf Deutsch (Deutschschweiz) und ein eigener Kurs auf Französisch (Romandie), also zwei getrennte Kurse. Ju-Jitsu: ein zweisprachiger Kurs.","ld_bild":"Judo und Ju-Jitsu haben je einen eigenen Kurs.","lang_ti":"Im Tessin findet das Modul immer auf Italienisch statt, im angegebenen Rhythmus.","langhint":"So liest du die Spalte «Rhythmus»: «je 1 Kurs DE und 1 Kurs FR» sind zwei getrennte Kurse, einer auf Deutsch und einer auf Französisch. «zweisprachig» ist ein gemeinsamer Kurs für beide Sprachen. Klicke auf ein Modul für die Details. «IT» bezeichnet den Kurs im Tessin auf Italienisch.","dKonf":"Konfiguration","cZul":"Zulassung","dZul":"Zulassung","lang_yr":"Jedes Jahr mindestens ein Angebot, organisiert mit anderen Sportarten. Die Regionen sind nicht getrennt.","lang_tog":"Ein gemeinsamer Kurs für die Deutschschweiz und die Romandie, alle zwei Jahre.","ld_multi":"Der Kurs findet gemeinsam mit mehreren Kampfsportarten statt. Judo und Ju-Jitsu besuchen denselben Kurs.","nET":"Nicht nötig: Sportart entdecken · Judo/Ju-Jitsu mit Kindern und Jugendlichen mit Behinderung · Talent Leistungssport (nur für Berufstrainer).","wabs":"Abschluss: das 13. Modul, Talent Leistungssport","wmod1":"Modul","wopen":"Module anzeigen","wclose":"Module ausblenden","wall":"Alle aufklappen","wnone":"Alle zuklappen","wplusk":"Zusätzlich zu Experte Foundation","wtip":"Tipp: Klicke auf einen Weg, um seine Module zu sehen. Mehrere Wege lassen sich nebeneinander öffnen.","ld_four":"Judo und Ju-Jitsu haben je eigene Kurse. Pro Sportart und Jahr gibt es einen Kurs auf Deutsch (Deutschschweiz) und einen eigenen Kurs auf Französisch (Romandie). Das sind vier getrennte Kurse.","lang_bily":"Ein zweisprachiger Kurs (Deutsch und Französisch) pro Jahr für alle Regionen. Es gibt nicht je einen Kurs pro Sprache.","cSp":"Sportart","sMix":"Mix","sSep":"getrennt"},"fr":{"eyebrow":"Fédération Suisse de Judo & Ju-Jitsu · Jeunesse+Sport","title":"La nouvelle structure des modules dès 2028","lead":"Un système commun pour le judo et le ju-jitsu : 17 modules, deux niveaux, trois parcours. Parcours les quatre domaines en cliquant.","n1":"Structure et offre","n2":"Équivalences","n3":"Parcours de formation","n4":"Tour de questions","d1":"17 modules, rythme, cours et rencontres","d2":"Que deviennent les modules actuels ?","d3":"Expert Foundation, Expert Talent, entraîneur professionnel","d4":"Tes questions dans Padlet","prev":"Retour","next":"Suivant","home":"Accueil","close":"Fermer","page":"Page","of":"sur","open":"Ouvrir","clickhint":"Astuce : clique sur un module pour voir les détails.","p1a":"17 modules en deux niveaux","a_t":"Au total","a_n":"17 modules","a_d":"Dès 2028, la même structure s'applique au judo et au ju-jitsu.","f_n":"11 modules","f_d":"Modules 1 à 11.","t_n":"6 modules","t_d":"Modules 12 à 17.","longer":"Tous les modules durent 1 jour, sauf :","days":"jours","day":"jour","p1b":"Foundation : modules 1 à 11","p1c":"Talent : modules 12 à 17","cNr":"N°","cMod":"Module","cTage":"Jours","cRh":"Rythme","cKurse":"Cours par an","cVor":"Condition préalable","EF":"EF","ET":"ET","BT":"EP","leg1":"EF = Expert Foundation · ET = Expert Talent · EP = entraîneur professionnel. Point = module obligatoire. DE = Suisse alémanique, FR = Romandie, IT = Tessin (cours en italien). Mixte = judo et ju-jitsu suivent le même cours, séparé = judo et ju-jitsu ont chacun leurs cours. Découvrir la discipline sportive (module 9) est organisé avec d'autres sports sous le sport « Allround ».","leg2":"Tous les modules Talent ont lieu en commun pour le judo et le ju-jitsu (mixte). Talent sport de performance exige les cinq autres modules Talent et a lieu avec plusieurs sports de combat. Condition physique et Psychologie/Coopération Talent donnent chacun un complément.","open_req":"encore à clarifier","all5":"les cinq autres modules Talent","p1d":"L'offre par année","o1t":"Cours organisés","o1n":"33","o1d":"en 2028, et 34 en 2029.","o2t":"Sports","o2n":"Surtout mixte","o2d":"Judo et ju-jitsu suivent le même cours. Seuls les modules 7 et 8 (Technique/Tactique Foundation) sont séparés.","o3t":"Régions 2028","o3n":"18 / 14 / 1","o3d":"Suisse alémanique, Romandie, Tessin. 2029 : 17 / 15 / 2.","o4t":"Jours de module","o4n":"43 resp. 44","o4d":"selon l'année, car tous les modules n'ont pas lieu chaque année.","o5":"De 2028 à 2035, cela représente 268 cours au total. Le Tessin (Suisse italophone) reçoit certains modules en alternance, au rythme indiqué ; les cours ont lieu en italien. Trois modules ont un cours bilingue (DE/FR) pour toutes les régions : Technique/Tactique Talent chaque année, Approfondissement Enseigner aux enfants et aux adolescents dès 2029 tous les deux ans, et Talent sport de performance tous les deux ans. Dans le décompte par région, ils sont comptés avec la Suisse alémanique.","p1e":"Modules le même week-end","cWith":"avec","cRes":"Résultat","we_n":"Les compléments condition physique et psychologie autorisent à donner des entraînements axés sur la « condition physique » ou la « psychologie » dans tous les sports, sans prescriptions de sécurité supplémentaires. Celui ou celle qui suit le module Foundation et le module Talent le même week-end obtient le complément en une seule rencontre.","or":"ou","p2a":"Équivalence : que deviennent les modules actuels ?","q1t":"Anciens modules","q1n":"9 sur 13","q1d":"sont entièrement remplacés par un ou deux nouveaux modules.","q2t":"Nouveaux modules","q2n":"13 sur 17","q2d":"ont un équivalent complet dans l'ancien système.","q3t":"Nouvelle offre nécessaire","q3n":"4 modules","q3d":"Formes de base du mouvement et du jeu, Psychologie/Coopération Foundation et Talent, Découvrir la discipline sportive.","q4":"Trois anciens modules n'ont pas d'équivalent : ComPass, les modules d'organisateurs cantonaux ou externes et le Module de formation continue des moniteurs/monitrices (MFL). Qu'un nouveau module figure à l'offre ne signifie pas que les anciens modules suivis sont reconnus automatiquement.","p2b":"Comment les anciens et les nouveaux modules sont comparés","r1t":"Comparaison","r1n":"Contenu, durée, groupe cible","r1d":"Chaque ancien module est comparé au nouveau module sur trois points : le contenu correspond-il ? La durée est-elle la même ? Le groupe cible est-il le même ?","r2t":"Dès 80 % de concordance","r2n":"Remplacement complet","r2d":"L'ancien module remplace entièrement le nouveau.","r3t":"Dès 40 % de concordance","r3n":"Remplacement partiel","r3d":"L'ancien module compte en partie, un complément est nécessaire. En dessous, il n'y a pas de reconnaissance.","r4":"Les modules plus courts et d'autres groupes cibles font baisser la valeur : si l'ancien module dure moins de jours que le nouveau, la valeur baisse dans la même proportion. Un groupe cible identique compte entièrement, un groupe proche pour moitié, un autre pas du tout. Les pourcentages pour le contenu sont des valeurs de départ, ajustés avec les documents de cours.","p2c":"Neuf anciens modules sont entièrement remplacés par de nouveaux modules","cAlt":"Ancien module","cErsetzt":"Remplace entièrement le nouveau module","n2c":"Neuf anciens modules sont entièrement remplacés par un ou deux nouveaux modules.","p2d":"Anciens modules sans équivalent complet","cWas":"Ce qui s'applique","n2d":"Quatre anciens modules ne sont pas entièrement remplacés : un équivalent partiel, trois sans équivalent.","p2e":"Du nouveau à l'ancien : Foundation","p2f":"Du nouveau à l'ancien : Talent","cNeu":"Nouveau module","cDurch":"Remplace (ancien module)","newfull":"nouveau module","voll":"complet","teilw":"partiel","n2e":"Pour chaque nouveau module : quel ancien module y mène. Trois modules Foundation sont entièrement nouveaux.","n2f":"Talent sport de performance exige les cinq autres modules Talent. Psychologie/Coopération Talent est nouveau.","p2g":"Principes de reconnaissance","g1t":"Principe 1","g1n":"Offre n'est pas reconnaissance","g1d":"Qu'un nouveau module remplace un ancien dans l'offre ne signifie pas que les modules suivis sont reconnus.","g2t":"Principe 2","g2n":"Seulement les modules réussis","g2d":"Une participation en tant qu'invité ne compte pas. Ce qui compte, c'est la biographie J+S dans la BDNS.","g3t":"Principe 3","g3n":"Formation continue 1 et 2","g3d":"La formation continue 1 compte comme Foundation, la formation continue 2 comme Talent. Qui possède tous les modules d'un niveau obtient l'équivalence pour tout le niveau.","g4":"Le délai de transition exact et les conditions supplémentaires restent à clarifier.","p3a":"Trois parcours, une base commune","base":"Base pour tous : cours de moniteur J+S, « cours d'introduction pour moniteurs/monitrices J+S » ou « cours d'introduction au système sportif suisse ».","wEF":"Expert Foundation","wET":"Expert Talent","wBT":"Entraîneur professionnel","wmods":"modules","wEF_d":"Tous les modules Foundation sauf Découvrir la discipline sportive et Judo/Ju-Jitsu avec handicap, plus Technique/Tactique Talent.","wET_d":"Les modules d'Expert Foundation plus Adolescents et compétition, Théorie de l'entraînement, Condition physique et Psychologie/Coopération Talent.","wBT_d":"Foundation sans Enseigner aux enfants et Formes de base du mouvement et du jeu, plus tous les modules Talent, y compris Talent sport de performance.","w_n":"Approfondissement Enseigner aux enfants et aux adolescents est obligatoire dans les trois parcours. Les modules Enseigner aux enfants et Enseigner aux adolescents sont exigés au préalable. Pour le parcours entraîneur professionnel, qui ne comprend pas Enseigner aux enfants, la règle reste à clarifier.","p3b":"Expert : d'abord Foundation, ensuite Talent","plus":"S'y ajoutent :","allEF":"Tous les modules d'Expert Foundation","n3b":"Non nécessaires : Découvrir la discipline sportive · Judo/Ju-Jitsu avec enfants et adolescents en situation de handicap · Talent sport de performance. Technique/Tactique Talent fait déjà partie du niveau Foundation.","p3c":"Entraîneur professionnel : un seul parcours","gF":"Niveau Foundation","gT":"Niveau Talent","gA":"Conclusion","n3c":"Supprimés : Enseigner aux enfants · Formes de base du mouvement et du jeu · Découvrir la discipline sportive · Judo/Ju-Jitsu avec enfants et adolescents en situation de handicap.","p3d":"Conditions préalables : de quoi ai-je besoin pour quoi ?","cVorM":"Condition préalable","cTal":"Module Talent (dès le 1er dan)","cZus":"Complément","zA":"Complément condition physique","zP":"Complément psychologie","n3d":"Modules exigés pour Approfondissement Enseigner aux enfants et aux adolescents : Enseigner aux enfants et Enseigner aux adolescents. Sans module suivant : Enseigner aux enfants, Formes de base du mouvement et du jeu, Découvrir la discipline sportive, Judo/Ju-Jitsu avec enfants et adolescents en situation de handicap. Les compléments condition physique et psychologie autorisent des entraînements axés sur ce thème dans tous les sports.","p4":"Tour de questions","q_lead":"Vos questions sur la nouvelle structure des modules.","q_txt":"Merci de noter tes questions à l'avance dans Padlet. Nous y répondrons lors du tour de questions au MFE.","padlet":"Noter mes questions dans Padlet","foot":"État au 28 octobre 2026. Le concept est présenté ; des modifications de détail restent réservées.","dStufe":"Niveau","dWege":"Obligatoire dans les parcours","dErsetzt":"Issu de","dNone":"aucune","dOffen":"La condition préalable reste à clarifier.","dWE":"Le même week-end avec","dZus":"Donne","eEdit":"Modifier les textes","eSave":"Enregistrer","eCancel":"Annuler","ePad":"Lien Padlet","eHint":"Clique dans un texte pour le modifier. Les textes valent par langue : bascule en haut entre DE et FR.","dLang":"Cours et langue","lang_sep":"Chaque année, il y a un cours en allemand (Suisse alémanique) et un cours distinct en français (Romandie). Ce sont deux cours séparés, pas un cours bilingue.","lang_cyc":"Un cours tous les deux ans, pour la Suisse alémanique et la Romandie ensemble.","lang_alt":"Chaque année un cours, en alternance en allemand et en français : chaque langue revient tous les deux ans.","lang_bil":"Un cours bilingue (allemand et français) pour toutes les régions. Il n'y a pas un cours par langue. Le module a lieu tous les deux ans, pour la première fois en 2029.","ld_mix":"Judo et ju-jitsu suivent le même cours.","ld_mix11":"Judo et ju-jitsu suivent le même cours.","ld_sepd":"Le judo et le ju-jitsu ont chacun leurs cours.","ld_two":"Judo : chaque année, un cours en allemand (Suisse alémanique) et un cours distinct en français (Romandie), donc deux cours séparés. Ju-jitsu : un cours bilingue.","ld_bild":"Judo et ju-jitsu ont chacun leur propre cours.","lang_ti":"Au Tessin, le module a toujours lieu en italien, au rythme indiqué.","langhint":"Comment lire la colonne « Rythme » : « 1 cours DE et 1 cours FR » signifie deux cours séparés, un en allemand et un en français. « bilingue » signifie un seul cours pour les deux langues. Clique sur un module pour les détails. « IT » désigne le cours au Tessin, en italien.","dKonf":"Configuration","cZul":"Admission","dZul":"Admission","lang_yr":"Chaque année au moins une offre, organisée avec d'autres sports. Les régions ne sont pas séparées.","lang_tog":"Un cours commun pour la Suisse alémanique et la Romandie, tous les deux ans.","ld_multi":"Le cours a lieu en commun avec plusieurs sports de combat. Judo et ju-jitsu suivent le même cours.","nET":"Non nécessaires : Découvrir la discipline sportive · Judo/Ju-Jitsu avec enfants et adolescents en situation de handicap · Talent sport de performance (uniquement pour les entraîneurs professionnels).","wabs":"Conclusion : le 13e module, Talent sport de performance","wmod1":"module","wopen":"Afficher les modules","wclose":"Masquer les modules","wall":"Tout ouvrir","wnone":"Tout fermer","wplusk":"En plus d'Expert Foundation","wtip":"Astuce : clique sur un parcours pour voir ses modules. Tu peux en ouvrir plusieurs côte à côte.","ld_four":"Le judo et le ju-jitsu ont chacun leurs cours. Par sport et par an, il y a un cours en allemand (Suisse alémanique) et un cours distinct en français (Romandie). Cela fait quatre cours séparés.","lang_bily":"Un cours bilingue (allemand et français) par an pour toutes les régions. Il n'y a pas un cours par langue.","cSp":"Sport","sMix":"mixte","sSep":"séparé"},"it":{"eyebrow":"Federazione Svizzera di Judo & Ju-Jitsu · Gioventù+Sport","title":"La nuova struttura dei moduli dal 2028","lead":"Un sistema comune per judo e ju-jitsu: 17 moduli, due livelli, tre percorsi. Naviga attraverso le quattro aree.","n1":"Struttura e offerta","n2":"Equivalenze","n3":"Percorsi formativi","n4":"Domande","d1":"17 moduli, ritmo, corsi e occasioni","d2":"Che ne sarà dei moduli attuali?","d3":"Esperto Foundation, Esperto Talent, Allenatore professionista","d4":"Le tue domande nel Padlet","prev":"Indietro","next":"Avanti","home":"Inizio","close":"Chiudi","page":"Pagina","of":"di","open":"Apri","clickhint":"Suggerimento: clicca su un modulo per vedere i dettagli.","p1a":"17 moduli in due livelli","a_t":"In totale","a_n":"17 moduli","a_d":"Dal 2028 vale la stessa struttura per judo e ju-jitsu.","f_n":"11 moduli","f_d":"Moduli da 1 a 11.","t_n":"6 moduli","t_d":"Moduli da 12 a 17.","longer":"Tutti i moduli durano 1 giorno, tranne:","days":"giorni","day":"giorno","p1b":"Foundation: moduli da 1 a 11","p1c":"Talent: moduli da 12 a 17","cNr":"N.","cMod":"Modulo","cTage":"Giorni","cRh":"Ritmo","cKurse":"Corsi all'anno","cVor":"Prerequisito","EF":"EF","ET":"ET","BT":"AP","leg1":"EF = Esperto Foundation · ET = Esperto Talent · AP = Allenatore professionista. Punto = modulo obbligatorio. DE = Svizzera tedesca, FR = Romandia, IT = Ticino (corsi in italiano). Misto = judo e ju-jitsu frequentano lo stesso corso, separato = judo e ju-jitsu hanno corsi propri. Scoprire la disciplina sportiva (modulo 9) è organizzato con altri sport nello sport «Allround».","leg2":"Tutti i moduli Talent si svolgono in comune per judo e ju-jitsu (misto). Talent sport di prestazione presuppone gli altri cinque moduli Talent e si svolge con più sport da combattimento. Condizione fisica e Psiche/Cooperazione Talent conferiscono ciascuno un complemento.","open_req":"da chiarire","all5":"tutti e cinque i moduli Talent","p1d":"L'offerta annuale","o1t":"Svolgimenti","o1n":"33","o1d":"nel 2028, nel 2029 sono 34.","o2t":"Sport","o2n":"Per lo più misto","o2d":"Judo e ju-jitsu frequentano lo stesso corso. Solo i moduli 7 e 8 (Tecnica/Tattica Foundation) sono separati.","o3t":"Regioni 2028","o3n":"18 / 14 / 1","o3d":"Svizzera tedesca, Romandia, Ticino. 2029: 17 / 15 / 2.","o4t":"Giorni di modulo","o4n":"43 o 44","o4d":"a seconda dell'anno, perché non tutti i moduli si svolgono ogni anno.","o5":"Dal 2028 al 2035 sono complessivamente 268 svolgimenti. Il Ticino (Svizzera italiana) riceve alcuni moduli a rotazione, al ritmo indicato; i corsi si svolgono in italiano. Tre moduli hanno un corso bilingue (DE/FR) per tutte le regioni: Tecnica/Tattica Talent ogni anno, Approfondimento Insegnare ai bambini e agli adolescenti dal 2029 ogni due anni e Talent sport di prestazione ogni due anni. Nel conteggio per regione sono contati con la Svizzera tedesca.","p1e":"Moduli nello stesso fine settimana","cWith":"insieme a","cRes":"Risultato","we_n":"I complementi Condizione fisica e Psiche autorizzano a svolgere allenamenti con focus «Condizione fisica» o «Psiche» in tutti gli sport, senza ulteriori prescrizioni di sicurezza. Chi frequenta il modulo Foundation e il modulo Talent nello stesso fine settimana ottiene il complemento in un'unica occasione.","or":"oppure","p2a":"Equivalenza: che ne sarà dei moduli attuali?","q1t":"Moduli attuali","q1n":"9 su 13","q1d":"sono sostituiti interamente da uno o due nuovi moduli.","q2t":"Nuovi moduli","q2n":"13 su 17","q2d":"hanno un'equivalenza completa nel sistema attuale.","q3t":"Nuova offerta necessaria","q3n":"4 moduli","q3d":"Forme di base del movimento e del gioco, Psiche/Cooperazione Foundation e Talent, Scoprire la disciplina sportiva.","q4":"Tre moduli attuali non hanno corrispondenza: ComPass, i moduli di organizzatori cantonali o esterni e il Modulo di formazione continua per monitori (MFL). Il fatto che un nuovo modulo sia in offerta non significa che i moduli attuali già frequentati siano riconosciuti automaticamente.","p2b":"Come vengono confrontati i moduli attuali e nuovi","r1t":"Confronto","r1n":"Contenuto, durata, gruppo target","r1d":"Ogni modulo attuale viene confrontato con il nuovo modulo su tre punti: il contenuto corrisponde? La durata è la stessa? Il gruppo target è lo stesso?","r2t":"Dall'80 % di concordanza","r2n":"Sostituzione completa","r2d":"Il modulo attuale sostituisce interamente il nuovo.","r3t":"Dal 40 % di concordanza","r3n":"Sostituzione parziale","r3d":"Il modulo attuale vale in parte, serve un complemento. Al di sotto non c'è riconoscimento.","r4":"Moduli più brevi e gruppi target diversi abbassano il valore: se il modulo attuale dura meno giorni del nuovo, il valore scende nella stessa proporzione. Un gruppo target identico vale per intero, uno affine per metà, uno diverso per nulla. Le percentuali per il contenuto sono valori iniziali e vengono verificate con i documenti del corso.","p2c":"Nove moduli attuali sono sostituiti interamente da nuovi moduli","cAlt":"Modulo attuale","cErsetzt":"Sostituisce interamente il nuovo modulo","n2c":"Nove moduli attuali sono sostituiti interamente da uno o due nuovi moduli.","p2d":"Moduli attuali senza equivalenza completa","cWas":"Cosa vale","n2d":"Quattro moduli attuali non sono sostituiti interamente: uno ha una corrispondenza parziale, tre nessuna.","p2e":"Dal nuovo all'attuale: Foundation","p2f":"Dal nuovo all'attuale: Talent","cNeu":"Nuovo modulo","cDurch":"Sostituisce (modulo attuale)","newfull":"nuovo modulo","voll":"completa","teilw":"parziale","n2e":"Per ogni nuovo modulo: quale modulo attuale porta a esso. Tre moduli Foundation sono completamente nuovi.","n2f":"Talent sport di prestazione presuppone gli altri cinque moduli Talent. Psiche/Cooperazione Talent è nuovo.","p2g":"Principi del riconoscimento","g1t":"Principio 1","g1n":"Offerta non significa riconoscimento","g1d":"Il fatto che un nuovo modulo sostituisca un modulo attuale nell'offerta non significa ancora che i moduli frequentati siano riconosciuti.","g2t":"Principio 2","g2n":"Solo moduli superati","g2d":"Una frequenza come ospite non conta. Fa stato la biografia G+S nella BDNS.","g3t":"Principio 3","g3n":"Formazione continua 1 e 2","g3d":"La formazione continua 1 vale come Foundation, la formazione continua 2 come Talent. Chi ha tutti i moduli di un livello ottiene l'equivalenza per l'intero livello.","g4":"Il termine transitorio esatto e le condizioni supplementari sono ancora da chiarire.","p3a":"Tre percorsi, una base comune","base":"Base per tutti: corso monitori G+S, «corso di introduzione per monitori G+S» o «corso di introduzione al sistema sportivo svizzero».","wEF":"Esperto Foundation","wET":"Esperto Talent","wBT":"Allenatore professionista","wmods":"moduli","wEF_d":"Tutti i moduli Foundation tranne Scoprire la disciplina sportiva e Judo/Ju-Jitsu con disabilità, più Tecnica/Tattica Talent.","wET_d":"I moduli di Esperto Foundation più Adolescenti e competizione, Teoria dell'allenamento, Condizione fisica e Psiche/Cooperazione Talent.","wBT_d":"Foundation senza Insegnare ai bambini e Forme di base del movimento e del gioco, più tutti i moduli Talent compreso Talent sport di prestazione.","w_n":"Approfondimento Insegnare ai bambini e agli adolescenti è obbligatorio in tutti e tre i percorsi. Sono richiesti i moduli Insegnare ai bambini e Insegnare agli adolescenti. Per il percorso Allenatore professionista, che non comprende Insegnare ai bambini, la regola è ancora da chiarire.","p3b":"Esperto: prima Foundation, poi Talent","plus":"Si aggiungono:","allEF":"Tutti i moduli di Esperto Foundation","n3b":"Non necessari: Scoprire la disciplina sportiva · Judo/Ju-Jitsu con bambini e adolescenti con disabilità · Talent sport di prestazione. Tecnica/Tattica Talent fa già parte del livello Foundation.","p3c":"Allenatore professionista: un percorso","gF":"Livello Foundation","gT":"Livello Talent","gA":"Conclusione","n3c":"Non previsti: Insegnare ai bambini · Forme di base del movimento e del gioco · Scoprire la disciplina sportiva · Judo/Ju-Jitsu con bambini e adolescenti con
